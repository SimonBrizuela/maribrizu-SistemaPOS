# Sitio de Netlify de la tienda pública. Es un sitio aparte del de la webapp de
# gestión: son dos aplicaciones distintas, con dominios distintos y públicos
# distintos, y compartir un sitio significaría que un despliegue de una
# arrastra a la otra.

# Las rutas van relativas a esta carpeta, no a la raíz del repositorio: el sitio
# está vinculado acá. Es como está el de la webapp, que tiene su carpeta base
# configurada del lado de Netlify.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Cabeceras de seguridad para todo el sitio. La tienda no se muestra dentro de
# un iframe de nadie, no usa cámara, micrófono ni ubicación, y el navegador no
# tiene por qué adivinar tipos de contenido. HSTS ya lo manda Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# El index nunca se cachea: es el que trae la lista de assets con hash. Si queda
# cacheado, el navegador sigue pidiendo el JS de la versión anterior.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El sitemap y el robots.txt los arman dos funciones (leen el catálogo
# publicado, así siempre están al día). Van antes del comodín de abajo, que si
# no se los queda y devuelve el index.html de la tienda como si fuera un
# sitemap.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200

# Rutas de verdad, sin almohadilla: /p/:id y /pedido/:id las resuelve el router
# del navegador, pero al entrar directo o al recargar el pedido llega al
# servidor y hay que devolverle el index igual.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
