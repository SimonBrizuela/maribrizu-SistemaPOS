<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Librería Liceo · Librería, mercería y regalería en Córdoba</title>
  <meta name="description" content="Comprá online en Librería Liceo. Cuadernos, mercería, juguetería y regalería con envío a domicilio en Córdoba o retiro en Av. Alfonsina Storni 168.">
  <meta name="theme-color" content="#0E0D10">

  <!-- El canonical, la etiqueta robots y el og:url los pone src/main.js según la
       dirección real de cada pantalla: la tienda vive hoy en beta. y va a
       pasar a la raíz, y no tiene que haber nada que acordarse de cambiar ese
       día. La imagen sí va fija y absoluta: WhatsApp no ejecuta JavaScript y
       la pide tal cual está acá. Apunta a la raíz porque las dos direcciones
       la sirven y esa es la que queda. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Librería Liceo">
  <meta property="og:title" content="Librería Liceo · Córdoba">
  <meta property="og:description" content="Todo para el cole, la casa y el regalo. Envío a domicilio en Córdoba o retiro en el local.">
  <meta property="og:locale" content="es_AR">
  <meta property="og:image" content="https://liceolibreria.com/portada.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="800">
  <meta property="og:image:alt" content="Librería Liceo, Córdoba">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://liceolibreria.com/portada.webp">

  <!-- La L va sin fondo: los cinco colores contrastan igual contra una barra
       clara que contra una oscura, así que el ícono sigue al tema del navegador.
       Los de aplicación sí van opacos: iOS y varios lanzadores rellenan la
       transparencia con negro. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icono-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <!-- Salta la navegacion para quien usa teclado o lector de pantalla: sin
       esto hay que tabular por el buscador y los filtros en cada pagina. -->
  <a class="saltar" href="#principal">Ir al contenido</a>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
