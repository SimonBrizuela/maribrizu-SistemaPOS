name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix git safe directory
        run: git config --global --add safe.directory "*"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller firebase-admin cryptography

      # La service account ya NO se empaqueta: el instalador es publico y
      # cualquiera podia extraerla. En su lugar va provision.json, que solo
      # habilita a pedir tokens de 1 hora al endpoint de Netlify.
      - name: Write provision.json
        env:
          POS_BOOTSTRAP_SECRET: ${{ secrets.POS_BOOTSTRAP_SECRET }}
          POS_PROVISION_URL: ${{ secrets.POS_PROVISION_URL }}
        shell: pwsh
        run: |
          if (-not $env:POS_BOOTSTRAP_SECRET) {
            Write-Error "Falta el secret POS_BOOTSTRAP_SECRET. Sin el, las PCs no pueden sincronizar."
            exit 1
          }
          # El valor guardado en GitHub puede arrastrar BOM o saltos de linea si
          # se pego desde un archivo generado con Out-File. El endpoint compara
          # byte a byte, asi que un BOM invisible devuelve 401 y deja a toda la
          # flota sin credenciales (paso en la v3.0.54).
          $sucios = [char[]]@([char]0xFEFF, [char]0x200B, ' ', "`t", "`r", "`n")
          $secret = $env:POS_BOOTSTRAP_SECRET.Trim($sucios)
          if (-not $secret) {
            Write-Error "POS_BOOTSTRAP_SECRET quedo vacio despues de limpiarlo."
            exit 1
          }
          $url = ($(if ($env:POS_PROVISION_URL) { $env:POS_PROVISION_URL } else { "https://posmr87.netlify.app/api/provision" })).Trim($sucios)
          $json = @{
            url        = $url
            secret     = $secret
            project_id = "mari-d7c71"
          } | ConvertTo-Json -Compress
          # WriteAllText con UTF8Encoding($false) evita el BOM que mete Out-File
          # en PowerShell 5.1 y que rompe el json.load del lado de Python.
          [IO.File]::WriteAllText("$PWD\provision.json", $json, (New-Object Text.UTF8Encoding($false)))
          Write-Host "provision.json escrito ($($json.Length) bytes) apuntando a $url - secreto de $($secret.Length) caracteres"

      - name: Patch APP_VERSION
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content pos_system/config.py) -replace 'APP_VERSION\s*=\s*"[^"]*"', "APP_VERSION = `"$tag`"" | Set-Content pos_system/config.py
          (Get-Content SistemaPOS_installer.iss) -replace 'APP_VERSION_PLACEHOLDER', $tag | Set-Content SistemaPOS_installer.iss
          Write-Host "Patched version to $tag"

      - name: Build portable (PyInstaller)
        run: python build_app.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc SistemaPOS_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/SistemaPOS_Setup.exe
            SistemaPOS_Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
