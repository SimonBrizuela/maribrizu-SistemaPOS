<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Chequeo del refresco en vivo de Cierres</title>
<link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body style="padding:16px">
<pre id="out">corriendo…</pre>
<div id="zona" style="display:none"></div>
<script type="module">
import { cajaAbiertaHTML, valoresCaja, huellaDeLaTabla } from '/src/pages/cierres.js';

const linea = [];
const ok = (cond, txt) => linea.push(`${cond ? 'OK   ' : 'FALLA'} ${txt}`);
const ts = iso => ({ seconds: Math.floor(new Date(iso).getTime() / 1000), nanoseconds: 0 });

// ══ Parte 1: el panel y el refresco en el lugar hablan el mismo idioma ══
// El refresco ubica cada número por su clave `data-cj`. Si una clave de
// valoresCaja() no tiene tarjeta, escribiría el valor equivocado en silencio.

const caja = {
  cajero: 'Web', fecha_apertura: ts('2026-09-17T08:30:00-03:00'),
  monto_inicial: 30000, total_ventas: 354840, total_efectivo: 187240,
  total_transferencia: 167600, total_transacciones: 64,
  total_retiros: 0, retiros: [], _pcs: 1,
};

const zona = document.getElementById('zona');
zona.innerHTML = cajaAbiertaHTML(caja, 137);
const panel = zona.querySelector('.cj-caja--abierta');
const v = valoresCaja(caja);

for (const clave of Object.keys(v)) {
  const tile = panel.querySelector(`.cj-stat[data-cj="${clave}"]`);
  ok(!!tile, `tarjeta data-cj="${clave}" existe`);
  if (tile) ok(tile.querySelector('.cj-stat-v').textContent === v[clave], `  muestra ${v[clave]}`);
}
ok(panel.querySelectorAll('.cj-stat').length === Object.keys(v).length,
   `el panel tiene ${panel.querySelectorAll('.cj-stat').length} tarjetas y valoresCaja() devuelve ${Object.keys(v).length}`);

const conRetiros = { ...caja, total_retiros: 145000,
  retiros: [{ reason: 'Pago proveedor', amount: 120000 }, { reason: 'Vuelto', amount: 25000 }] };
zona.innerHTML = cajaAbiertaHTML(conRetiros, 137);
const p2 = zona.querySelector('.cj-caja--abierta');
ok(p2.querySelector('.cj-stat[data-cj="retiros"]').classList.contains('cj-stat--neg'),
   'con retiros la tarjeta queda marcada en rojo');
ok(p2.querySelector('.cj-stat[data-cj="retiros"] .cj-stat-v').textContent === '-$145.000,00',
   'el retiro se muestra en negativo');
ok(p2.querySelectorAll('.cj-retiro').length === 2, 'se listan los 2 retiros');

// ══ Parte 2: la huella avisa cuando la tabla o los totales quedaron viejos ══
// Es lo que decide si alcanza con mover los números o hay que redibujar todo.

linea.push('');
const ABIERTA = 137;

const cierresBase = [
  { id: '137', register_id: 137, fecha_apertura: ts('2026-09-17T08:30:00-03:00'),
    fecha_cierre: '', cajero: 'Web', monto_inicial: 30000, total_ventas: 0,
    total_efectivo: 0, total_transferencia: 0, total_retiros: 0,
    total_transacciones: 0, monto_final: 0, pendiente_conteo: false },
  { id: '136', register_id: 136, fecha_apertura: ts('2026-09-16T08:30:00-03:00'),
    fecha_cierre: ts('2026-09-16T20:32:00-03:00'), cajero: 'Maria',
    monto_inicial: 30000, total_ventas: 1157701, total_efectivo: 530501,
    total_transferencia: 627200, total_retiros: 0, total_transacciones: 154,
    monto_final: 0, pendiente_conteo: true },
];
const itemsBase = [
  { cash_register_id: 137, subtotal: 1000 },
  { cash_register_id: 137, subtotal: 2000 },
  { cash_register_id: 136, subtotal: 3000 },
  { cash_register_id: null, subtotal: 500 },
];

const base = huellaDeLaTabla(cierresBase, itemsBase, ABIERTA);
const clonar = o => JSON.parse(JSON.stringify(o));
const cambia = (nombre, cierres, items, debeCambiar) => {
  const h = huellaDeLaTabla(cierres, items, ABIERTA);
  const cambio = h !== base;
  ok(cambio === debeCambiar,
     `${nombre} → ${debeCambiar ? 'redibuja' : 'NO redibuja'}${cambio === debeCambiar ? '' : ` (dio ${cambio ? 'redibuja' : 'NO redibuja'})`}`);
};

// Lo que NO debe redibujar: es el caso de cada venta, el que causaba el parpadeo.
cambia('una venta más en la caja abierta',
       cierresBase, [...itemsBase, { cash_register_id: 137, subtotal: 900 }], false);
cambia('cambian los totales de la caja abierta (los mueve el panel)',
       (() => { const c = clonar(cierresBase); c[0].total_ventas = 99999; return c; })(),
       itemsBase, true);   // el doc igual cambió: redibujar es correcto, no molesta

// Lo que SÍ debe redibujar: si no, la pantalla se queda vieja.
cambia('se carga el efectivo contado de un cierre',
       (() => { const c = clonar(cierresBase); c[1].pendiente_conteo = false; c[1].monto_final = 560501; return c; })(),
       itemsBase, true);
cambia('una PC mergea su reporte a un cierre cerrado',
       (() => { const c = clonar(cierresBase); c[1].total_ventas = 1200000; c[1].total_efectivo = 560000; return c; })(),
       itemsBase, true);
cambia('una venta vieja sincroniza tarde en una caja cerrada',
       cierresBase, [...itemsBase, { cash_register_id: 136, subtotal: 700 }], true);
cambia('se cierra la caja abierta',
       (() => { const c = clonar(cierresBase); c[0].fecha_cierre = ts('2026-09-17T20:30:00-03:00'); return c; })(),
       itemsBase, true);
cambia('se abre una caja nueva',
       [...clonar(cierresBase), { id: '138', register_id: 138, fecha_apertura: ts('2026-09-18T08:30:00-03:00'),
         fecha_cierre: '', cajero: 'Web', monto_inicial: 30000, total_ventas: 0, total_efectivo: 0,
         total_transferencia: 0, total_retiros: 0, total_transacciones: 0, monto_final: 0, pendiente_conteo: false }],
       itemsBase, true);
cambia('se borra un cierre',
       clonar(cierresBase).slice(0, 1), itemsBase, true);
cambia('cambia el cajero de un cierre',
       (() => { const c = clonar(cierresBase); c[1].cajero = 'Sofía'; return c; })(),
       itemsBase, true);
cambia('se carga un retiro en la caja abierta',
       (() => { const c = clonar(cierresBase); c[0].total_retiros = 50000; return c; })(),
       itemsBase, true);

// Sin caja abierta la huella tiene que seguir mirando la tabla.
const sinAbierta = huellaDeLaTabla(cierresBase, itemsBase, null);
const sinAbierta2 = huellaDeLaTabla(
  (() => { const c = clonar(cierresBase); c[1].pendiente_conteo = false; return c; })(), itemsBase, null);
ok(sinAbierta !== sinAbierta2, 'sin caja abierta, cargar un conteo igual redibuja');

const fallas = linea.filter(l => l.startsWith('FALLA')).length;
document.getElementById('out').textContent =
  linea.join('\n') + `\n\n${fallas === 0 ? 'TODO OK' : fallas + ' FALLAS'}`;
</script>
</body>
</html>
